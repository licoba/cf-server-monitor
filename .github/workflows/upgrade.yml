name: Upstream Sync and Deploy

# 每天 03:00（北京时间）检查上游 huilang-me/CF-Server-Monitor：
# - 有更新时合并到 main 并推送
# - 仅当 version.json 的 workers 版本变化时才构建并部署（避免每个开发提交都上线）
# 也可在 Actions 页面手动触发（手动触发会强制部署一次）

on:
  schedule:
    - cron: "0 19 * * *" # UTC 19:00 = 北京时间 03:00
  workflow_dispatch:

concurrency:
  group: upstream-sync-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      prev: ${{ steps.ver.outputs.prev }}
      next: ${{ steps.merge.outputs.next }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read current version
        id: ver
        run: echo "prev=$(node -p "require('./version.json').workers")" >> "$GITHUB_OUTPUT"

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/huilang-me/CF-Server-Monitor.git || true
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date"
          else
            git merge --no-edit upstream/main
            git push origin HEAD:main
          fi
          echo "next=$(node -p "require('./version.json').workers")" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.prev != needs.sync.outputs.next || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Write CI wrangler config
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          cat > wrangler.ci.toml <<EOF
          name = "cf-server-monitor"
          main = "src/index.js"
          compatibility_date = "2024-12-01"
          compatibility_flags = ["nodejs_compat"]
          keep_vars = true

          [triggers]
          crons = ["*/1 * * * *", "0 * * * *"]

          [assets]
          directory = "./dist"
          binding = "ASSETS"

          [[d1_databases]]
          binding = "DB"
          database_name = "server-monitor-db"
          database_id = "${D1_DATABASE_ID}"

          [[durable_objects.bindings]]
          name = "METRICS_BROADCASTER"
          class_name = "MetricsBroadcaster"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["MetricsBroadcaster"]
          EOF

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.ci.toml
